<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed — INAM TECH ZONE</title>
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/components/header-footer.css" />
<link rel="stylesheet" href="/assets/css/style.css" />
<!-- DNS Preconnect for Google Apps Script Redirect Server -->
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
</head>
<body>
<div id="site-header"></div>

<div class="container" style="padding-top:60px;padding-bottom:80px;text-align:center">
  <div style="font-size:46px;margin-bottom:10px">✅</div>
  <h1>Order placed!</h1>
  <p style="color:var(--muted);max-width:420px;margin:0 auto 20px">Thanks for shopping with us. Save your order ID to track its status any time.</p>
  <div class="spec-strip" style="justify-content:center;font-size:15px;margin-bottom:26px">
    Order ID: <strong id="order-number-display" style="color:var(--ink)"></strong>
  </div>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <a id="track-link" class="btn btn-primary">Track this order</a>
    <a href="/shop.html" class="btn btn-outline">Continue shopping</a>
  </div>
</div>

<div id="site-footer"></div>
<script src="/assets/js/config.js"defer></script>
<script src="/assets/js/api.js"defer></script>
<script src="/assets/js/ui.js"defer></script>
<script src="/assets/js/storage.js"defer></script>
<script src="/assets/js/tracking.js"defer></script>
<script src="/assets/js/i18n.js"defer></script>
<script src="/components/layout-loader.js"defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const orderNumber = new URL(window.location.href).searchParams.get("orderNumber") || "";
    document.getElementById("order-number-display").textContent = orderNumber;
    document.getElementById("track-link").href = "/track-order.html?orderNumber=" + encodeURIComponent(orderNumber);
  });
</script>
</body>
</html>
