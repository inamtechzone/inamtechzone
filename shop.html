<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — INAM TECH ZONE</title>
<meta name="description" content="Browse all electronics and gadgets at INAM TECH ZONE." />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

<div id="site-header"></div>

<!-- Padding فکس کی گئی ہے تاکہ ہیڈر کے نیچے کنٹینٹ نہ چھپے -->
<main class="container" style="padding-top:40px; padding-bottom:60px; min-height: 80vh;">
  <div class="section-head" style="margin-top:0">
    <h2 id="search-title">Shop</h2>
    <span id="result-count" style="font-size:13.5px;color:var(--muted)"></span>
  </div>

  <div id="category-chips" class="chip-row"></div>
  <div id="brand-chips" class="chip-row" style="margin-top:8px"></div>

  <!-- Responsive Filter Box -->
  <div class="card" style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;margin-bottom:26px">
    <div class="field" style="margin-bottom:0">
      <label for="min-price">Min price</label>
      <input id="min-price" type="number" min="0" placeholder="0" style="width:110px" />
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="max-price">Max price</label>
      <input id="max-price" type="number" min="0" placeholder="Any" style="width:110px" />
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="sort-select">Sort by</label>
      <select id="sort-select" style="width:170px">
        <option value="newest">Newest</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="name_asc">Name: A to Z</option>
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:8px;cursor:pointer">
      <input id="in-stock-check" type="checkbox" /> In stock only
    </label>
    <button id="apply-filters-btn" class="btn btn-outline btn-sm" style="margin-bottom:2px">Apply filters</button>
  </div>

  <!-- Product Grid -->
  <div id="shop-grid" class="product-grid"></div>
  <div id="pagination" style="margin-top:24px"></div>
</main>

<div id="site-footer"></div>

<!-- Core JavaScript Files -->
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/storage.js" defer></script>
<script src="/assets/js/img-cdn.js" defer></script>
<script src="/assets/js/tracking.js" defer></script>
<script src="/assets/js/i18n.js" defer></script>
<script src="/assets/js/layout.js" defer></script>

<!-- صرف Shop Page کی اسکرپٹ (home.js کو یہاں سے ہٹا دیا گیا ہے) -->
<script src="/assets/js/pages/shop.js" defer></script>

</body>
</html>
