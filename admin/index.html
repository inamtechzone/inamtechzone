<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — INAM TECH ZONE Admin</title>

<!-- SEO & Admin Robots Rule -->
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="INAM TECH ZONE Admin Dashboard for managing products, orders, and sales performance." />

<!-- 1. Google Fonts Optimization (Font-display & Preconnect) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</noscript>

<!-- CSS Assets -->
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/admin.css" />

<!-- 2. Optimized & Non-blocking JavaScript Loading (defer) -->
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/auth.js" defer></script>
<script src="/assets/js/admin/layout.js" defer></script>
<script src="/assets/js/admin/dashboard.js" defer></script>
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <main id="admin-main" class="admin-main">
    <h2>Dashboard</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total products</div><div id="stat-products" class="value">—</div></div>
      <div class="stat-card"><div class="label">Total orders</div><div id="stat-orders" class="value">—</div></div>
      <div class="stat-card"><div class="label">Pending orders</div><div id="stat-pending" class="value">—</div></div>
      <div class="stat-card"><div class="label">Customers</div><div id="stat-customers" class="value">—</div></div>
      <div class="stat-card"><div class="label">Total revenue</div><div id="stat-revenue" class="value">—</div></div>
      <div class="stat-card"><div class="label">This month</div><div id="stat-monthly" class="value">—</div></div>
    </div>
    
    <div class="section-head" style="margin-top:10px">
      <h3 style="margin:0">Recent orders</h3>
      <a href="/admin/orders.html" style="font-size:13.5px;font-weight:600;color:var(--accent)">View all →</a>
    </div>
    
    <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th scope="col">Order ID</th>
            <th scope="col">Customer</th>
            <th scope="col">Total</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody id="recent-orders-body"></tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
