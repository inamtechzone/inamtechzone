<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Categories — INAM TECH ZONE Admin</title><meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" /><link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <main id="admin-main" class="admin-main">
    <h2>Categories</h2>
    <form id="category-form" class="card" style="display:flex;gap:12px;margin-bottom:20px;max-width:480px">
      <input id="category-name-input" placeholder="Category name" required style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);color:var(--ink)">
      <button id="category-form-btn" class="btn btn-primary btn-sm" type="submit">Add</button>
    </form>
    <div class="table-scroll">
      <table class="admin-table">
        <thead><tr><th></th><th>Name</th><th>Slug</th><th>Products</th><th></th></tr></thead>
        <tbody id="categories-body"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="/assets/js/config.js"defer></script><script src="/assets/js/api.js"></script><script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"defer></script><script src="/assets/js/admin/layout.js"></script><script src="/assets/js/admin/categories.js"></script>
</body>
</html>
