<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Users — INAM TECH ZONE Admin</title><meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" /><link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <main id="admin-main" class="admin-main">
    <h2>Admin users</h2>
    <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">Only SuperAdmins can manage other admin accounts.</p>
    <form id="admin-form" class="card" style="max-width:520px;margin-bottom:24px">
      <div class="field-row">
        <div class="field"><label>Name</label><input name="name" required></div>
        <div class="field"><label>Email</label><input name="email" type="email" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Password</label><input name="password" type="password" required minlength="6"></div>
        <div class="field"><label>Role</label>
          <select name="role"><option value="Staff">Staff</option><option value="Admin">Admin</option><option value="SuperAdmin">SuperAdmin</option></select>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" type="submit">Create admin</button>
    </form>
    <div class="table-scroll">
      <table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="admins-body"></tbody></table>
    </div>
  </main>
</div>
<script src="/assets/js/config.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"></script><script src="/assets/js/admin/layout.js"></script><script src="/assets/js/admin/admins.js"></script>
</body>
</html>
