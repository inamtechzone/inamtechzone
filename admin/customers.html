<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customers — INAM TECH ZONE Admin</title><meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" /><link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside id="admin-sidebar" class="admin-sidebar"></aside>
  <main id="admin-main" class="admin-main">
    <div class="section-head" style="margin-top:0"><h2 style="margin:0">Customers</h2><span id="customer-total" style="font-size:13.5px;color:var(--muted)"></span></div>
    <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">Customers are derived automatically from order history — there's no separate signup, since checkout is guest-only.</p>
    <input id="customer-search" placeholder="Search by name or phone…" style="margin-bottom:18px;width:100%;max-width:320px;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);color:var(--ink)">
    <div class="table-scroll">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Phone</th><th>City</th><th>Orders</th><th>Total spent</th><th>Last order</th></tr></thead>
        <tbody id="customers-body"></tbody>
      </table>
    </div>
    <div id="customers-pagination"></div>
  </main>
</div>
<script src="/assets/js/config.js"defer></script><script src="/assets/js/api.js"></script><script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"defer></script><script src="/assets/js/admin/layout.js"></script><script src="/assets/js/admin/customers.js"></script>
</body>
</html>
